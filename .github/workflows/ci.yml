name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Trellis project license declarations
        run: |
          grep -Fxq 'license = "MIT"' Cargo.toml
          grep -Fxq 'MIT License' LICENSE
          grep -Fq 'MIT. See [LICENSE]' README.md

      - name: Validate App Center advisory catalog
        run: |
          python3 scripts/check_app_center.py
          node --check app-center/app.js

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

  winget-mock-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test WinGet adapter with a mock (no actual installs)
        run: cargo test core::winget::tests
